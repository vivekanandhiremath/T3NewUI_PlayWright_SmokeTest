name: Playwright Smoke Test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Install Playwright browsers and OS dependencies
      run: mvn exec:java -e -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps"

    - name: Run SmokeTest
      env:
        EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      run: xvfb-run mvn test -Dtest=SmokeTest

    - name: Upload Test Reports
      if: always() # Always run this step even if the test fails
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          target/extent-reports/
          logs/
        retention-days: 7
